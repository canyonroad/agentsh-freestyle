# agentsh server configuration for Freestyle VM sandbox
# Extends default config with settings optimized for Freestyle VM environment

server:
  http:
    addr: "127.0.0.1:18080"
    read_timeout: "30s"
    write_timeout: "60s"
    max_request_size: "10MB"
  grpc:
    enabled: true
    addr: "127.0.0.1:9090"

auth:
  type: "none"

logging:
  level: "info"
  format: "text"
  output: "stderr"

sessions:
  base_dir: "/var/lib/agentsh/sessions"
  max_sessions: 100
  default_timeout: "1h"
  default_idle_timeout: "15m"
  cleanup_interval: "5m"

audit:
  enabled: true
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"

sandbox:
  enabled: true
  allow_degraded: true  # Allow running without all features

  limits:
    max_memory_mb: 4096
    max_cpu_percent: 100
    max_processes: 256

  # FUSE filesystem for file operation interception
  # Covers workspace paths only (per-session mount at workspace-mnt)
  # System-path file_rules require Landlock (not available in Freestyle kernel)
  fuse:
    enabled: true
    deferred: true
    deferred_marker_file: "/tmp/.agentsh-fuse-enabled"
    deferred_enable_command: ["sudo", "/bin/chmod", "666", "/dev/fuse"]
    audit:
      mode: "soft_delete"

  network:
    enabled: true
    intercept_mode: "all"
    proxy_listen_addr: "127.0.0.1:0"
    # eBPF cgroup/connect hooks. The 4-layer detect bug (#196) was fixed
    # in v0.18.0 / #199, BUT the Freestyle kernel ships WITHOUT BTF
    # (/sys/kernel/btf/vmlinux is missing), so cilium/ebpf can't relocate
    # types and the CO-RE programs fail to load. Until Freestyle ships a
    # kernel with CONFIG_DEBUG_INFO_BTF=y, network enforcement runs via
    # the userspace proxy + Landlock instead. agentsh's capability check
    # now refuses to start when ebpf is asked for but BTF is missing,
    # so we leave it OFF on Freestyle.
    ebpf:
      enabled: false

  # Cgroups v2 — Freestyle places agentsh under
  # /system.slice/freestyle-supervisor.service/, whose subtree_control is
  # empty (canyonroad/agentsh#197). v0.18.0 ships #202 / #214: ProbeCgroupsV2
  # auto-falls back to a top-level /sys/fs/cgroup/agentsh.slice when the
  # nested cgroup has no delegated controllers. Leaving base_path unset so
  # the probe picks the right mode automatically — no manual workaround.
  cgroups:
    enabled: true

  # Seccomp - per-command wrapper via agentsh-unixwrap (inherently deferred)
  seccomp:
    enabled: true
    file_monitor:
      enabled: false  # Requires Yama (not in kernel) for ProcessVMReadv; conflicts with FUSE when enabled

  # Unix socket wrapper - seccomp-based unix socket interception
  unix_sockets:
    enabled: true

# Security mode - landlock: Landlock + FUSE (the kernel now ships with
# landlock since Freestyle added it). agentsh's auto-detect will pick `full`
# when seccomp+ebpf+fuse are all up, and `landlock` will then be applied via
# the unixwrap binary on every wrapped command (independent of mode). Setting
# `auto` lets agentsh pick the best mode for the detected feature set.
security:
  mode: auto
  strict: false
  warn_degraded: true

# Landlock filesystem + network enforcement (kernel 5.13+, ABI v4 needs 6.7+).
# Now available on Freestyle. Enabled here so `agentsh-unixwrap` applies the
# ruleset before exec'ing each wrapped command. The ruleset is auto-derived
# from the active policy's `file_rules` allow entries (see
# canyonroad/agentsh#209 — wildcard-op derivation + MAKE_SOCK was fixed in
# v0.18.0, so `operations: ["*"]` rules now feed paths into the ruleset).
#
# We also list explicit allow/deny paths below as defence-in-depth — the
# derived set covers our policy's allow rules but the extras here pin down
# essential system paths the kernel/dynamic linker need before the policy
# loader runs, plus container-escape sockets that should never be reachable.
landlock:
  enabled: true

  # Directories where execution is allowed (binary loaders need read+exec)
  allow_execute:
    - "/usr/bin"
    - "/bin"
    - "/usr/local/bin"
    - "/usr/sbin"
    - "/sbin"
    - "/usr/lib"
    - "/usr/lib64"
    - "/lib"
    - "/lib64"
    - "/usr/libexec"

  # Directories where reading is allowed (system libs, certs, configs)
  allow_read:
    - "/usr"
    - "/lib"
    - "/lib64"
    - "/bin"
    - "/sbin"
    - "/etc/ssl"
    - "/etc/ca-certificates"
    - "/etc/resolv.conf"
    - "/etc/hosts"
    - "/etc/nsswitch.conf"
    - "/etc/passwd"
    - "/etc/group"
    - "/etc/localtime"
    - "/etc/ld.so.cache"
    - "/etc/ld.so.conf"
    - "/etc/ld.so.conf.d"
    - "/etc/fuse.conf"
    - "/proc/self"
    - "/sys/fs/cgroup"
    - "/dev/null"
    - "/dev/zero"
    - "/dev/random"
    - "/dev/urandom"
    - "/dev/tty"
    - "/dev/pts"

  # Directories where writes are allowed beyond the workspace.
  # Workspace itself is auto-added by agentsh from the session workspace.
  allow_write:
    - "/tmp"
    - "/var/tmp"
    - "/dev/null"
    - "/dev/stdout"
    - "/dev/stderr"
    - "/dev/pts"
    - "/proc/self"
    - "/var/lib/agentsh"
    - "/var/log/agentsh"

  # Paths explicitly denied. These are excluded from the ruleset; combined
  # with the deny-by-default model, anything not in allow_* is blocked.
  deny_paths:
    - "/etc/shadow"
    - "/etc/gshadow"
    - "/etc/sudoers"
    - "/etc/sudoers.d"
    - "/etc/profile.d"
    - "/etc/bash.bashrc"
    - "/etc/cron.d"
    - "/etc/cron.daily"
    - "/etc/cron.hourly"
    - "/etc/systemd"
    - "/var/run/docker.sock"
    - "/run/docker.sock"
    - "/run/containerd/containerd.sock"
    - "/run/crio/crio.sock"
    - "/var/run/secrets/kubernetes.io"
    - "/run/systemd/private"
    - "/proc/1"
    - "/proc/sys/kernel"
    - "/root"
    - "/home/user/.ssh"
    - "/home/user/.aws"
    - "/home/user/.gcloud"
    - "/home/user/.azure"
    - "/home/user/.config/gcloud"
    - "/home/user/.kube"
    - "/home/user/.bashrc"
    - "/home/user/.bash_profile"
    - "/home/user/.profile"

  # Network restrictions (Landlock ABI v4, kernel 6.7+). Freestyle is on
  # 6.1.0 — ABI v2, no network landlock yet — so these are no-ops here, but
  # leaving the explicit allow on outbound TCP so agentsh's proxy/eBPF layer
  # remains the network gate. Will activate automatically once Freestyle ships
  # a 6.7+ kernel.
  network:
    allow_connect_tcp: true
    allow_bind_tcp: false

# Capabilities as recommended by agentsh detect
capabilities:
  allow: []

proxy:
  mode: "embedded"
  port: 0
  providers:
    anthropic: "https://api.anthropic.com"
    openai: "https://api.openai.com"

dlp:
  mode: "redact"
  patterns:
    email: true
    phone: true
    credit_card: true
    ssn: true
    api_keys: true
  custom_patterns:
    - name: openai_key
      display: OPENAI_KEY
      regex: "sk-[a-zA-Z0-9]{48,}"
    - name: anthropic_key
      display: ANTHROPIC_KEY
      regex: "sk-ant-[a-zA-Z0-9-]{95,}"
    - name: aws_access_key
      display: AWS_KEY
      regex: "AKIA[0-9A-Z]{16}"
    - name: github_pat
      display: GITHUB_TOKEN
      regex: "ghp_[a-zA-Z0-9]{36}"
    - name: github_oauth
      display: GITHUB_OAUTH
      regex: "gho_[a-zA-Z0-9]{36}"
    - name: jwt_token
      display: JWT
      regex: "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
    - name: private_key
      display: PRIVATE_KEY
      regex: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
    - name: slack_token
      display: SLACK_TOKEN
      regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"

policies:
  dir: "/etc/agentsh/policies"
  default_policy: "default"
  env_shim_path: "/usr/lib/agentsh/libenvshim.so"

approvals:
  enabled: false
  mode: "async"
  timeout: "5m"

metrics:
  enabled: true
  path: "/metrics"

health:
  path: "/health"
  readiness_path: "/ready"

development:
  disable_auth: true
  verbose_errors: false
